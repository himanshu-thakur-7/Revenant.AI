[project]
name = "revenant"
version = "0.1.0"
description = "Revenant — the autonomous outbound engineer. Hunts pain, ships a working prototype, films an AI walkthrough, follows up while you sleep."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Himanshu Thakur", email = "himan7781@gmail.com" }]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "openai>=1.40",
    "python-pptx>=1.0",  # agents/sales/deck.py + agents/demo_razorpay_deck.py —
                         # hard top-level imports, never declared here; agents.sales
                         # (and everything that imports it, incl. the MCP server's
                         # build_full_outreach/draft_outreach tools) failed to import
                         # at all in a fresh env until this was added.
    "mcp>=1.2,<2",   # agents/mcp_server.py uses the v1 FastMCP API (mcp.server.fastmcp);
                     # v2 renamed it to MCPServer + moved the import path — see
                     # https://py.sdk.modelcontextprotocol.io/v2/migration/. Migrating is
                     # real work (every @mcp.tool()/Context usage), tracked as a Phase 1
                     # task alongside the supports_parallel_tool_calls hardening, not a
                     # silent drive-by fix.
    "google-api-python-client>=2.100",  # agents/sales/gmail_draft.py — googleapiclient,
    "google-auth>=2.30",                # google.auth / google.oauth2, and
    "google-auth-oauthlib>=1.2",        # google_auth_oauthlib.flow — all lazily imported
                                         # (function-level, not top-level), so the earlier
                                         # module-import sweep missed this one entirely;
                                         # only surfaced by actually running draft_outreach
                                         # end to end. Deck + email draft generation worked
                                         # fine; only the final Gmail-draft step 404'd with
                                         # ModuleNotFoundError('googleapiclient').
]

[project.optional-dependencies]
# Heavier / environment-specific extras. The core pipeline runs without these
# in OFFLINE mode (canned fixtures), so tests and the golden-set gate never
# require network or a browser.
media = ["playwright>=1.45"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
# Legacy scripted pipeline — kept working for the console demo.
ghost = "ghost.cli:app"
# The new agent-fleet CLI. `revenant chat` opens the Orchestrator REPL.
# NOTE: `hermes profile create revenant` (the isolated bot profile set up
# this session) also generates a wrapper script named `revenant` at
# ~/.local/bin/revenant — a DIFFERENT thing (Hermes CLI, not this one).
# Whichever is earlier on PATH wins; check `which revenant` if unsure.
revenant = "agents.cli:app"
# T1 deterministic eval checks (evals/). Deliberately NOT named `revenant`
# for the same collision reason.
revenant-eval = "evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghost", "agents"]

[tool.pytest.ini_options]
testpaths = ["ghost/tests", "agents", "evals"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
