name: CI

# T0 only — contract/unit tests, offline, no network, <5s locally. T1-T3
# (deterministic artifact checks, LLM judge, live e2e) need real API keys
# and hit real URLs by design; they run via `make eval`/`make eval-judge`/
# `make eval-live` locally and a scheduled job, not on every push. See
# docs/evals-observability-design.md §1.7.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  t0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv venv --python 3.11 .venv

      - name: Install dependencies
        run: uv pip install --python ./.venv/bin/python -e ".[dev]"

      - name: ruff
        run: ./.venv/bin/python -m ruff check .
        continue-on-error: true  # 360+ pre-existing findings as of 2026-08-27 —
                                 # not gating CI on a backlog it didn't create;
                                 # remove continue-on-error once that's cleaned up

      - name: pytest (T0 — offline, no network)
        env:
          REVENANT_MODE: offline
        run: ./.venv/bin/python -m pytest -q
