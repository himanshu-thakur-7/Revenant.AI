name: CI

# T0 only — contract/unit tests, offline, no network, <5s locally. T1-T3
# (deterministic artifact checks, LLM judge, live e2e) need real API keys
# and hit real URLs by design; they run via `make eval`/`make eval-judge`/
# `make eval-live` locally and a scheduled job, not on every push. See
# docs/evals-observability-design.md §1.7.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  t0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv venv --python 3.11 .venv

      - name: Install dependencies
        run: uv pip install --python ./.venv/bin/python -e ".[dev]"

      - name: ruff
        run: ./.venv/bin/python -m ruff check .
        continue-on-error: true  # 360+ pre-existing findings as of 2026-08-27 —
                                 # not gating CI on a backlog it didn't create;
                                 # remove continue-on-error once that's cleaned up

      - name: pytest (T0 — offline, no network)
        env:
          REVENANT_MODE: offline
        run: ./.venv/bin/python -m pytest -q

  web:
    # The website/ handlers are the auth boundary and had zero automated
    # coverage until now. Separate job from t0: no Python, no uv, and it
    # should stay green independently of the agent suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # node:test + the glob form used below

      - name: web tests (session + handlers, offline)
        working-directory: website
        run: node --test "test/*.test.mjs"

  ui:
    # console.html's escaping path is the highest-risk UI code in the
    # product: everything it renders comes from an LLM relaying text from
    # prospect websites, and renderRichMessage uses innerHTML so URLs
    # become clickable. These tests only ran when someone remembered to
    # type `make test-ui` — a suite that is not wired to anything decays,
    # and an XSS regression would ship silently.
    #
    # Needs a browser, so it is a separate job from t0 rather than a
    # reason to put Chromium into the fast offline gate. Still no network
    # beyond the install: a local static server plus stubbed API routes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv venv --python 3.11 .venv

      - name: Install dependencies (+ playwright)
        run: |
          uv pip install --python ./.venv/bin/python -e ".[dev,media]"
          ./.venv/bin/python -m playwright install --with-deps chromium

      - name: console UI suite
        run: ./.venv/bin/python -m pytest ui_tests/ -q
